<style>
/* Layout: sticky search bar; each move is one row - the move cell exactly as a boss-guide card shows it,
   beside the game's full description, so missing or wrong blurb notes stand out. */
:root {
  --bg: #f3f1f6; --panel: #ffffff; --line: #d9d3e2; --fg: #221d2b; --muted: #6c6479; --accent: #6a4fd8; --accent-soft: #e7e0fb;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --guide-font: Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17141c; --panel: #221d2a; --line: #3a3344; --fg: #f1edf7; --muted: #a59cb3; --accent: #9d86ff; --accent-soft: #2f2747; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17141c; --panel: #221d2a; --line: #3a3344; --fg: #f1edf7; --muted: #a59cb3; --accent: #9d86ff; --accent-soft: #2f2747; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
h1 { font-family: var(--display); font-size: 1.25rem; margin: 0; }
.count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
input[type=search], select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
input[type=search] { width: 16rem; max-width: 100%; }
label.chk { display: flex; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.help { font-size: 0.85rem; color: var(--muted); margin: 0; padding-block: 10px 4px; max-width: 72rem; }
.list { display: grid; gap: 6px; padding-block: 8px 40px; }
.row { display: grid; grid-template-columns: minmax(240px, 330px) minmax(0, 1fr); gap: 12px; align-items: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
/* the move cell, styled like the boss guide card (black text area, type-colored gradient) */
.cell { font-family: var(--guide-font); font-weight: bold; text-align: center; border: 1px solid #000; border-radius: 4px; padding: 4px 6px; }
.cell .nm { font-size: 1.05rem; line-height: 1.15; }
.cell .bp { font-size: 0.8em; font-style: italic; }
.cell .note { font-size: 0.72rem; margin-top: 2px; }
.cell .note:empty { display: none; }
.meta { min-width: 0; }
.meta .tags { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.meta .desc { font-size: 0.9rem; line-height: 1.45; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
</style>

<div class="bar gut">
  <h1>Remix Move Blurbs</h1>
  <span class="count" id="count"></span>
  <div class="tools">
    <input type="search" id="q" placeholder="Search moves, blurbs or descriptions" aria-label="Search">
    <select id="type" aria-label="Type"><option value="">All types</option></select>
    <select id="cat" aria-label="Category"><option value="">All categories</option><option>Physical</option><option>Special</option><option>Status</option></select>
    <label class="chk"><input type="checkbox" id="onlyplain"> Blurb shows only BP</label>
  </div>
</div>

ffect gives +1 Accuracy."}, {"n": "Belly Drum", "t": "Normal", "c": "Status", "b": "6 Atk for 50% HP", "d": "The user vigorously bangs on its chest or belly. This gives +6 Attack in exchange for 50% of their max HP. Z-Effect heals user."}, {"n": "Sludge Bomb", "t": "Poison", "c": "Special", "b": "90 BP | 30% Poison", "d": "The user hurls unsanitary sludge, exploding all over the target. This poisons 30% of the time."}, {"n": "Mud Shot", "t": "Ground", "c": "Special", "b": "45 BP, +1 Priority", "d": "The user quickly fires a compact clump of mud before the target can react. This has +1 priority."}, {"n": "Scum Shot", "t": "Poison", "c": "Special", "b": "50 BP, +4 Priority | ALWAYS Badly Poisons, ALWAYS Flinches, Turn 1 Only", "d": "The user catches the foe off guard, firing thick, dark sludge, leaving them badly poisoned. +4 Priority, flinches but only works on turn 1."}, {"n": "Spikes", "t": "Ground", "c": "Status", "b": "Hazard, 12-25% on switch-in", "d": "The user lays spikes at the foe's side. This damages grounded foes when switching in, for 12-25% of their HP. Z-Effect +1 Attack."}, {"n": "Zap Cannon", "t": "Electric", "c": "Special", "b": "130 BP | User -2 Sp. Atk", "d": "The user fires off a massive electric blast. Lowers the user's Sp. Atk by 2 after use, however."}, {"n": "Scorching Sands", "t": "Ground", "c": "Special", "b": "60 BP | ALWAYS Burns, 1.5x in Sand", "d": "The user engulfs the target in a wave of searing-hot sand. This ALWAYS burns, and is boosted by 50% in a sandstorm."}, {"n": "Destiny Bond", "t": "Ghost", "c": "Status", "b": "+4 Priority", "d": "A Pokemon that knocks out the user also faints if this move was used. +4 Priority. Z-Effect makes the user the center of attention."}, {"n": "Perish Song", "t": "Ghost", "c": "Status", "b": "All on field faint in 5 turns", "d": "Any Pokemon that hears this sound faints in 5 turns. Switching out removes the timer- but the AI does not switch. Z-Effect heals."}, {"n": "Icy Wind", "t": "Ice", "c": "Special", "b": "60 BP | ALWAYS -2 Spe", "d": "The user attacks with a gust of freezing air. This ALWAYS lowers the foe's Speed stat by 2."}, {"n": "Burning Bulwark", "t": "Fire", "c": "Status", "b": "+6 Priority | No 2x in a row", "d": "The user defends itself while heating itself up- burning any attackers who make contact while protected. No use 2x in a row. Z-Effect: +1 Defense."}, {"n": "Bone Rush", "t": "Ground", "c": "Physical", "b": "50 BP, +1 Priority | Hits airborne foes", "d": "The user swiftly tosses a bone before the target can react. Hits airborne targets neutrally. This has +1 Priority."}, {"n": "Take-Aim", "t": "Steel", "c": "Status", "b": "TBD", "d": "Will be finalized/revealed once the boss fight guide is filled out."}, {"n": "Raging Fury", "t": "Fire", "c": "Physical", "b": "130 BP", "d": "Will be finalized/revealed once the boss fight guide is filled out."}, {"n": "Sandstorm", "t": "Rock", "c": "Status", "b": "+2 Priority", "d": "The user summons a raging sandstorm for 5 turns. Boosts Rock type's Sp. Def by 50%. Z-Effect gives +1 Sp. Def. Has +2 Priority."}, {"n": "Giga Drain", "t": "Grass", "c": "Special", "b": "75 BP | 50% Drain", "d": "A strong nutrient-draining attack. This user's HP is restored by 50% of the damage dealt."}, {"n": "Endure", "t": "Normal", "c": "Status", "b": "+6 Priority | No 2x in a row", "d": "The user braces itself, surving an attack that would've knocked it out. Fails consecutively. Z-Effect makes user center of attention."}, {"n": "Charm", "t": "Fairy", "c": "Status", "b": "-2 Atk", "d": "The user fools the target by acting cute, making them less hostile. This drops Attack by 2 stages. Z-Effect +1 Attack."}, {"n": "Roll-Out", "t": "Rock", "c": "Physical", "b": "90 BP | Switches Out", "d": "The user rolls into the target at high speed, then uses its momentum to roll back & switch places with a party member."}, {"n": "Papercut", "t": "Grass", "c": "Physical", "b": "60 BP | Always Crits, SE vs Grass", "d": "Kartana slashes the foe with its paper blade. This ALWAYS crits, and is super-effective on Grass & Steel types."}, {"n": "Bait N' Switch", "t": "Dark", "c": "Status", "b": "Taunts 3 turns, Switches Out", "d": "The user provokes the target into attacking for 3 turns, then makes a quick getaway, switching with a party member. Z-Effect: Heals the replacement."}, {"n": "Milk Drink", "t": "Normal", "c": "Status", "b": "+4 Priority | Heals 100%", "d": "The user drinks its own supply of milk, and feeds its allies too! Heals 2/3 HP. With Z-Power, the user draws attention to itself."}, {"n": "Spark", "t": "Electric", "c": "Physical", "b": "45 BP, +1 Priority", "d": "Charged with electricity, the user rapidly dashes at the foe. This has +1 Priority."}, {"n": "Creeping Strike", "t": "Bug", "c": "Physical", "b": "45 BP, +1 Priority", "d": "The user creeps up on the target and strikes suddenly. This has +1 priority."}, {"n": "Steel Wingbeat", "t": "Steel", "c": "Physical", "b": "40 BP | 2 Hits, ALWAYS -1 Def", "d": "The user batters the target twice with powerful steel-hard wings. Each strike lowers the target's Defense. (92 BP, 124 BP, 134 BP, etc)"}, {"n": "Mesmer-Eyes", "t": "Psychic", "c": "Status", "b": "Sleep", "d": "The user mesmerizes the target with its eyes, putting them to sleep for 2 turns. Fails on Ghost-types. Z-Effect resets lowered stats."}, {"n": "Attract", "t": "Normal", "c": "Status", "b": "Infatuates", "d": "Doesn't exist."}, {"n": "Lucid Dream", "t": "Psychic", "c": "Status", "b": "+1 Priority", "d": "The user dreams so vividly, it uses one of its moves while alseep. This has +1 Priority. Z-Effect gives +1 Sp. Atk & turns into a Z-Attack."}, {"n": "Heal Bell", "t": "Psychic", "c": "Status", "b": "Heals 50%", "d": "The user rings its bell, chiming throughout the user's party. This cures status AND heals 50% throughout your entire party. Z-Effect: Resets lowered stats."}, {"n": "Hoodwink", "t": "Fairy", "c": "Physical", "b": "85 BP | 30% Flinch", "d": "The user unleashes an unexpectedly vicious blow after putting on a cute act. 30% flinch rate."}, {"n": "Special Delivery", "t": "Fairy", "c": "Physical", "b": "45 BP, 80% Acc | 3 Hits, Uses Higher Atk Stat", "d": "Delibird gives the target 3 gifts with a hidden trap. When used on an ally, each hit heals them by 50% instead. Uses higher stat."}, {"n": "Hit N' Run", "t": "Dark", "c": "Physical", "b": "70 BP | Switches Out", "d": "The user attacks violently, then runs off before they can react. Switches the user out to another party member after attacking."}, {"n": "Safeguard", "t": "Psychic", "c": "Status", "b": "Blocks stat drops 10 turns", "d": "The user guards its side of the field with a mysterious, protecive force. This blocks all stat drops on their side for 10 turns. Z-Heals."}, {"n": "Pain Split", "t": "Ghost", "c": "Status", "b": "Averages HP with target", "d": "The user adds its HP to the target's HP, then equally divides that HP between itself and the foe. Z-Effect +1 Sp. Def."}, {"n": "Infernal Parade", "t": "Ghost", "c": "Special", "b": "125 BP, 85% Acc | ALWAYS Burns", "d": "The user attacks with an infernal flame fueled by spiritual energy. This ALWAYS burns the target."}, {"n": "Aftershock", "t": "Ground", "c": "Physical", "b": "140 BP, -5 Priority", "d": "The user destabilizes the ground until a violent seismic wave tears through it. This move usually strikes last. (-5 Priority)"}, {"n": "Knockout Punch", "t": "Fighting", "c": "Physical", "b": "125 BP, 80% Acc | Foe falls asleep next turn (2 turns)", "d": "The user punches with immense power. The resulting fatigue causes the target to fall asleep (for 2 turns!) after the next turn."}, {"n": "Megahorn", "t": "Bug", "c": "Physical", "b": "140 BP | 50% Recoil, 30% Flinch", "d": "The user rams its impressive horn or pointed appendage into the target with no letup. This deals 50% recoil damage. 30% flinch rate."}, {"n": "Dragon Breath", "t": "Dragon", "c": "Special", "b": "75 BP | ALWAYS Paralyzes", "d": "The user exhales intense breath crackling with dragon energy. This ALWAYS leaves the target paralyzed."}, {"n": "Baton Pass", "t": "Normal", "c": "Status", "b": "-6 Priority", "d": "The user passes on any stat boosts it has to a party member. This ALWAYS goes last. Z-Effect heals the replacement fully."}, {"n": "Encore", "t": "Normal", "c": "Status", "b": "Locks last move 3 turns", "d": "The user compels the target to keep using the move it last used for three turns. Z-Effect +1 Speed."}, {"n": "Pursuit", "t": "Dark", "c": "Physical", "b": "75 BP | 2x if foe switches out", "d": "This relentless attack DOUBLES in power if the foe attempts to switch that turn."}, {"n": "Rapid Spin", "t": "Normal", "c": "Physical", "b": "40 BP | +1 Spe", "d": "The user performs a spin-attack, boosting Speed by 1 and clearing entry hazards, bindings and Leech Seed. Matches type of the user."}, {"n": "Sweet Scent", "t": "Grass", "c": "Status", "b": "-1 Sp. Atk, Sp. Def, Eva", "d": "The user soothes all opponents with a pleasant smell, lowering their fighting spirit. Drops Sp. Atk, Sp. Def & Evasion by 1. Z-Effect: Center of attention."}, {"n": "Iron Tail", "t": "Steel", "c": "Physical", "b": "95 BP | 50% +1 Def", "d": "The target is slammed with a steel-hard tail. This has a 50% chance to boost the user's Defense stat by 1."}, {"n": "Laceration", "t": "Steel", "c": "Physical", "b": "80 BP | High Crit", "d": "The user brutally rends the target with hard, razor-sharp claws or blades, leaving deep wounds. This has a 50% (+2) crit rate."}, {"n": "Skirmish", "t": "Fighting", "c": "Physical", "b": "70 BP | ALWAYS -1 Atk, Sp. Atk", "d": "The user picks a fight and roughhouses the target. Drops both of the foe's offensive stats once per target."}, {"n": "Morning Sun", "t": "Fire", "c": "Status", "b": "Heals 50% (2/3 in Sun)", "d": "The user heals itself by 50% of its max HP. This restores 2/3 HP in the Sun, and 1/3 HP in other weather. Z-Effect gives +1 Sp. Def."}, {"n": "Synthesis", "t": "Grass", "c": "Status", "b": "Heals 50% (2/3 in Sun)", "d": "The user heals itself by 50% of its max HP. This restores 2/3 HP in the Sun, and 1/3 HP in other weather. Z-Effect gives +1 Sp. Def."}, {"n": "Moonlight", "t": "Fairy", "c": "Status", "b": "Heals 50% (2/3 in Lunar Aura)", "d": "The user draws power from the moon, healing itself by 50% HP. If Lunar Aura is active, heals 2/3 HP. Only heals 1/3 in sunlight. Z-Effect: +1 Sp. Def."}, {"n": "Flashbang", "t": "Normal", "c": "Special", "b": "50 BP, +4 Priority | ALWAYS Flinches, Turn 1 Only, Matches User Type", "d": "The user releases a blinding burst of light. Matches the user's type, ALWAYS flinches, has +4 priority, but can only be used on turn 1."}, {"n": "Cross Chop", "t": "Fighting", "c": "Physical", "b": "80 BP | High Crit", "d": "The user delivers a powerful chop with two hands, blades, or the like. This has a 50% (+2) critical hit rate."}, {"n": "Twister", "t": "Dragon", "c": "Special", "b": "90 BP | 50% Confuse, 1.5x in Rain", "d": "The user whips up the air violenty. This is boosted by 50% if it is raining. 50% chance to confuse opponents."}, {"n": "Rain Dance", "t": "Water", "c": "Status", "b": "+2 Priority", "d": "The user does a dance to summon the rain. Z-Effect gives +1 Sp. Def, +2 Priority."}, {"n": "Sunny Day", "t": "Fire", "c": "Status", "b": "+2 Priority", "d": "The user summons strong sunlight. Z-Effect gives +1 Sp. Def. +2 Priority."}, {"n": "Crunch", "t": "Dark", "c": "Physical", "b": "90 BP | 30% -1 Def", "d": "The user bites down hard and violently onto the foe. This has a 30% chance to drop the foe's Defense."}, {"n": "Mirror Coat", "t": "Psychic", "c": "Special", "b": "Varies BP, -6 Priority | 2x Special damage taken back", "d": "The user moves last, reflecting 2x damage taken from any Special Attack back to the target."}, {"n": "Psych Up", "t": "Psychic", "c": "Status", "b": "+4 Priority", "d": "Using psychic powers, the user copies any stat changes the target has. This has +4 Priority. Z-Effect heals user fully."}, {"n": "Extreme Speed", "t": "Normal", "c": "Physical", "b": "80 BP, +3 Priority", "d": "The user charges the target at blinding speed. This has +3 Priority."}, {"n": "Ancient Power", "t": "Rock", "c": "Special", "b": "75 BP | ALWAYS -1 Atk, Sp. Atk", "d": "The user attacks with rocks imbued with a strange primal energy. Drops both of the foe's offensive stats once per target."}, {"n": "Shadow Ball", "t": "Ghost", "c": "Special", "b": "90 BP | 30% -1 Sp. Def", "d": "The user hurls a shadowy blob at the target. This has a 30% chance to drop the target's Sp. Def."}, {"n": "Future Sight", "t": "Psychic", "c": "Special", "b": "140 BP | Hits 2 turns later", "d": "The user foresees a very powerful psychic blast that will strike the target 2 turns after the move is used."}, {"n": "Boulder Bash", "t": "Rock", "c": "Physical", "b": "85 BP | ALWAYS -1 Def", "d": "The user punches the foe with rock-shattering strength. This ALWAYS drops the foe's Defense stat by 1."}, {"n": "Whirlpool", "t": "Water", "c": "Special", "b": "60 BP | Traps", "d": "The user envelops the target in an intense whirlpool, trapping them in battle for 8 turns & dealing 12% of their HP per turn."}, {"n": "Beat Up", "t": "Dark", "c": "Physical", "b": "Varies BP | 6 Hits", "d": "Ganging up on the foe, this uses the user's Attack stat, but the BP of each hit is calculated with: (Party Member Base Attack/10) +5."}, {"n": "Fake Out", "t": "Normal", "c": "Physical", "b": "40 BP, +5 Priority | ALWAYS Flinches, Turn 1 Only", "d": "The user fakes the target out, flinching them. Can only be used on the 1st turn. Has +5 Priority."}, {"n": "Uproar", "t": "Fighting", "c": "Special", "b": "85 BP | ALWAYS Confuses", "d": "The user creates a boisterous ruckus. Confuses those who hear it. If the foes are asleep, this does 50% more- but wakes them up."}, {"n": "Stockpile", "t": "Normal", "c": "Status", "b": "1 Def, +1 Sp. Def (max 3)", "d": "The user stockpiles energy, which raises its Defense & Sp. Def stats by 1. This can only be used 3 times. Z-Effect heals user fully."}, {"n": "Spew Out", "t": "Poison", "c": "Special", "b": "150 BP | Always Crits, ALWAYS -2 Sp. Def", "d": "The user upchucks its caustic stomach contents. For every Stockpile, this gains 100 BP. ALWAYS CRITS and drops Sp. Def by 2."}, {"n": "Swallow", "t": "Normal", "c": "Status", "b": "+4 Priority | Heals 100%", "d": "The user heals 1/3 for 1 stockpile, 1/2 for 2, and full HP for 3 stockpiles. This now has +4 priority. Z-Move gives +1 all stats. (Doesn't work with Simple.)"}, {"n": "Heat Wave", "t": "Fire", "c": "Special", "b": "60 BP | Always Crits, 10% Burn", "d": "The user blows a burning, abrasive wind at the foes. This ALWAYS results in a critical hit. 10% burn rate."}, {"n": "Snowscape", "t": "Ice", "c": "Status", "b": "+2 Priority", "d": "The user summons a snowstorm lasting 5 turns. Now boosts the Defense of Ice types. Z-Effect gives +1 Sp. Def. +2 Priority."}, {"n": "Torment", "t": "Dark", "c": "Status", "b": "No same move twice", "d": "The user torments and enrages the foe, making them incapable of using the same move twice in a row. Z-Effect gives +1 Accuracy."}, {"n": "Curtain Call", "t": "Dark", "c": "Status", "b": "Encores foe, Switches Out", "d": "The user calls for an encore before making its exit. The foe must repeat its last move, while the user switches to a party member. Z: Heals replacement."}, {"n": "Will-O-Wisp", "t": "Fire", "c": "Status", "b": "Burns", "d": "The user burns the target with an eerie flame. Z-Effect makes the user the center of attention."}, {"n": "Bitter Malice", "t": "Ghost", "c": "Special", "b": "60 BP | ALWAYS -1 Atk, Sp. Atk", "d": "The user attacks with spine-chilling resentment. This ALWAYS lowers both offensive stats by 1, once per target."}, {"n": "Facade", "t": "Normal", "c": "Physical", "b": "75 BP | 2x if user is burned/poisoned/paralyzed", "d": "This attack's power is doubled if the user is burnt, poisoned or paralyzed. Contact."}, {"n": "Ice Breaker", "t": "Ice", "c": const TYPES = ["Normal","Fire","Water","Electric","Grass","Ice","Fighting","Poison","Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Dark","Steel","Fairy"];
const C = DATA.colors;
function hsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0, s = 0, l = (mx + mn) / 2;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
  return [h, s, l];
}
function fromHsl(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const rgb = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return "#" + rgb.map(v => Math.round((v + m) * 255).toString(16).padStart(2, "0")).join("");
}
// same text color rule as the boss guide (darker, more saturated type color)
const LIGHT = { Flying: 0.5, Dragon: 0.56 };
function textColor(t) { const [h, s, l] = hsl(C[t]); return fromHsl(h, Math.min(1, s * 1.25 + 0.1), l * (LIGHT[t] || 0.36)); }
function topColor(hex) { const n = parseInt(hex.slice(1), 16); return "#" + [16, 8, 0].map(sh => { const v = n >> sh & 255; return Math.round(v + (255 - v) * 0.3).toString(16).padStart(2, "0"); }).join(""); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hi(s, q) { if (!q) return esc(s); const i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); }
function split(blurb) {
  const m = blurb.match(/^(\d+|Varies) BP/); const bp = m ? m[1] + " BP" : "";

  return [bp, note];
}
const sel = document.getElementById("type");

      "<div class='meta'><div class='tags'>" + m.t + " · " + m.c + "</div><div class='desc'>" + hi(m.d, q) + "</div></div></div>";

}
