<title>Signature Item Order</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a sticky toolbar over one wall of item cards in the current order. Each card = the item's big icon
   tile and name; drag a card to move it. Submit saves the order for the site. */
:root {
  /* one dark look for the whole board; only the item icon tiles stay light so the icons read clearly */
  --bg: #17141c; --panel: #221d2a; --card: #241f2d; --line: #3a3344; --fg: #f1edf7; --muted: #a59cb3;
  --accent: #9d86ff; --accent-soft: #2f2747; --pill: #2c2636; --icon-bg: #f3f1f6; --icon-fg: #221d2b; --ok: #63c483;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --z: 1;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
h1 { font: 700 20px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
.count { font: 500 12px var(--mono); color: var(--muted); }
.spacer { flex: 1 1 auto; }
button { font: 600 13px var(--body); border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.zoom { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 12px; }
.zoom button { padding: 3px 9px; }
#status { font-size: 12px; color: var(--muted); min-width: 0; }
#status.ok { color: var(--ok); }
.help { font-size: 12px; color: var(--muted); margin-top: 6px; }
main { padding-block: 16px 40px; }
#wall { display: flex; flex-wrap: wrap; gap: calc(var(--z) * 10px); align-items: flex-start; }
/* a card: the big icon block joined to the holders pill */
.card { display: flex; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--z) * 14px);
  cursor: grab; user-select: none; touch-action: none; max-width: 100%; }
.card:active { cursor: grabbing; }
.card .no { font: 500 calc(var(--z) * 10px) var(--mono); color: var(--muted); align-self: flex-start; padding: calc(var(--z) * 5px) 0 0 calc(var(--z) * 7px); min-width: calc(var(--z) * 18px); }
.icon { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  width: calc(var(--z) * 86px); padding: calc(var(--z) * 6px) calc(var(--z) * 4px); background: var(--icon-bg);
  border-radius: 0 calc(var(--z) * 13px) calc(var(--z) * 13px) 0; }
.icon img { width: calc(var(--z) * 64px); height: calc(var(--z) * 64px); image-rendering: pixelated; }
.icon .nm { font: 600 calc(var(--z) * 10.5px)/1.15 var(--body); text-align: center; text-wrap: balance; color: var(--icon-fg); }
.pill { display: flex; flex-wrap: wrap; align-items: center; align-content: center; gap: 0 calc(var(--z) * 2px);
  max-width: calc(var(--z) * 260px); margin: calc(var(--z) * 8px); padding: calc(var(--z) * 4px) calc(var(--z) * 10px);
  background: var(--pill); border-radius: 999px; }
.pill img { width: calc(var(--z) * 40px); height: calc(var(--z) * 30px); object-fit: contain; image-rendering: pixelated; transform: scaleX(-1); }
.ghost { opacity: .35; }
.chosen { box-shadow: 0 0 0 2px var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="gut">
  <div class="bar">
    <h1>Signature Item Order</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <div class="zoom" aria-label="Card size"><span>Size</span>
      <button type="button" id="zoomOut" aria-label="Smaller cards">−</button>
      <button type="button" id="zoomIn" aria-label="Bigger cards">+</button>
    </div>
    <button type="button" id="reset">Reset to the site's order</button>
    <button type="button" class="primary" id="submit">Submit order</button>
  </div>
  <div class="help">Drag an item to move it. The site's Featured item order follows this once you submit. <span id="status"></span></div>
</header>
<main class="gut"><div id="wall"></div></main>

const SPRITES = {};  // sprite key -> [Pokemon name, data URI]
const BY_NAME = new Map(ITEMS.map(i => [i.name, i]));
const DEFAULT = ITEMS.map(i => i.name);
const DRAFT_KEY = "remixItemOrderDraft", ZOOM_KEY = "remixItemOrderZoom";
const wall = document.getElementById("wall"), statusEl = document.getElementById("status");
let db = null, submittedKey = null;

function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
// a saved order, with any item it doesn't know dropped and any new item added at the end
function clean(list) { const seen = new Set(); const out = (list || []).filter(n => BY_NAME.has(n) && !seen.has(n) && seen.add(n)); return out.concat(DEFAULT.filter(n => !seen.has(n))); }
let order = clean(JSON.parse(load(DRAFT_KEY) || "null") || DEFAULT);

function card(name, i) {
  const it = BY_NAME.get(name);
  const el = document.createElement("div");
  el.className = "card"; el.dataset.name = name;
  const no = document.createElement("span"); no.className = "no"; no.textContent = i + 1;
  const icon = document.createElement("div"); icon.className = "icon";
  const img = document.createElement("img"); img.src = it.icon; img.alt = "";
  const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = name;
  icon.append(img, nm);
  el.append(no, icon); // items only (Dooz, 2026-11-22): no holder sprites
  return el;
}
function render() {
  wall.replaceChildren(...order.map(card));
  document.getElementById("count").textContent = order.length + " items";
  showStatus();
}
function renumber() { [...wall.children].forEach((c, i) => c.querySelector(".no").textContent = i + 1); }
function key(list) { return list.join("|"); }
function showStatus(msg) {
  statusEl.classList.remove("ok");
  if (msg) { statusEl.textContent = msg; return; }
  if (!db) { statusEl.textContent = "Saving is off here, so your order stays in this browser only."; return; }
  if (submittedKey === key(order)) { statusEl.textContent = "Submitted."; statusEl.classList.add("ok"); }
  else statusEl.textContent = submittedKey ? "Changed since your last submit." : "Not submitted yet.";
}
Sortable.create(wall, { animation: 120, ghostClass: "ghost", chosenClass: "chosen",
  onEnd() { order = [...wall.children].map(c => c.dataset.name); store(DRAFT_KEY, JSON.stringify(order)); renumber(); showStatus(); } });

document.getElementById("reset").addEventListener("click", () => { order = DEFAULT.slice(); store(DRAFT_KEY, null); render(); });
document.getElementById("submit").addEventListener("click", async () => {
  if (!db) { showStatus("Can't submit here: open this page on claude.ai while signed in."); return; }
  showStatus("Submitting…");
  try {
    await db.doc("orders/items").set({ items: order, count: order.length, submittedAt: new Date().toISOString() });
    submittedKey = key(order); showStatus();
  } catch (e) { showStatus("Couldn't submit (" + (e && (e.code || e.message) || "error") + "). Try again in a moment."); }
});
function setZoom(z) { z = Math.min(1.6, Math.max(0.6, Math.round(z * 10) / 10)); document.documentElement.style.setProperty("--z", z); store(ZOOM_KEY, String(z)); }
setZoom(parseFloat(load(ZOOM_KEY)) || 1);
document.getElementById("zoomIn").addEventListener("click", () => setZoom((parseFloat(load(ZOOM_KEY)) || 1) + 0.1));
document.getElementById("zoomOut").addEventListener("click", () => setZoom((parseFloat(load(ZOOM_KEY)) || 1) - 0.1));
render();

(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { showStatus(); return; }
  try {
    const s = await db.doc("orders/items").get();
    const d = s && (s.data ? s.data() : s);
    if (d && d.items) {
      submittedKey = key(clean(d.items));
      if (!load(DRAFT_KEY)) { order = clean(d.items); render(); return; } // no local draft: start from the submitted order
    }
  } catch (e) {}
  showStatus();
})();
</script>
